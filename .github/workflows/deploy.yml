name: CI/CD Pipeline - Smart Redressal System

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: code-smart
  EKS_CLUSTER_NAME: code-smart-cluster
  IMAGE_TAG: ${{ github.sha }}

jobs:

# -------------------------------
# 1. BUILD IMAGE (LOCAL BUILD ONLY)
# -------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t code-smart:${IMAGE_TAG} .

# -------------------------------
# 2. PUSH TO ECR
# -------------------------------
  push-to-ecr:
    name: Push to Amazon ECR
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS AUTH
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # CREATE ECR REPO IF NOT EXISTS
      - name: Create ECR repo if not exists
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION || \
          aws ecr create-repository \
            --repository-name $ECR_REPOSITORY \
            --region $AWS_REGION

      # LOGIN TO ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # BUILD + PUSH IMAGE (FIXED SAFE VERSION)
      - name: Build, tag and push image
        run: |
          set -e

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          if [ -z "$ACCOUNT_ID" ]; then
            echo "ERROR: ACCOUNT_ID is empty"
            exit 1
          fi

          ECR_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}

          echo "Using ECR: $ECR_URI"

          docker build -t $ECR_URI:$IMAGE_TAG .
          docker tag $ECR_URI:$IMAGE_TAG $ECR_URI:latest

          docker push $ECR_URI:$IMAGE_TAG
          docker push $ECR_URI:latest

# -------------------------------
# 3. DEPLOY TO EKS
# -------------------------------
  deploy:
    name: Deploy to EKS
    needs: push-to-ecr
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION

      # ENSURE NAMESPACE EXISTS
      - name: Ensure namespace exists
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      # DEPLOY IMAGE UPDATE
      - name: Deploy to Kubernetes (rolling update)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}

          kubectl set image deployment/code-smart \
            nginx=$ECR_URI:$IMAGE_TAG \
            -n production

      # VERIFY
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/code-smart -n production
          kubectl get pods -n production