version: "3.8"

services:
  db:
    image: postgres:15
    container_name: pgrs_db
    restart: always
    environment:
      POSTGRES_DB: pgrs_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: pgrs_app
    depends_on:
      - db
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pgrs_project
      DB_USER: postgres
      DB_PASSWORD: postgres123
    volumes:
      - .:/app

volumes:
  pgdata:
