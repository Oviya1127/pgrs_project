<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - SPGRS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="sidebar-brand-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 21h18" stroke="#1a202c" stroke-width="1.2" stroke-linecap="round"/><path d="M5 21V9h14v12" stroke="#1a202c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9v6" stroke="#1a202c" stroke-width="1.2"/></svg></div>
                    <div>
                        <div class="sidebar-brand-text">SPGRS</div>
                        <div class="sidebar-brand-subtitle">User Portal</div>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main Menu</div>
                    <a href="user_dashboard.html" class="nav-item">
                        <span class="nav-item-icon"><i class="fa-solid fa-gauge-high"></i></span> Dashboard
                    </a>
                    <a href="submit_grievance.html" class="nav-item">
                        <span class="nav-item-icon"><i class="fa-solid fa-square-plus"></i></span> Submit Grievance
                    </a>
                    <a href="track_grievance.html" class="nav-item">
                        <span class="nav-item-icon"><i class="fa-solid fa-magnifying-glass-location"></i></span> Track Grievances
                    </a>
                    <a href="user_notifications.html" class="nav-item active">
                        <span class="nav-item-icon"><i class="fa-regular fa-bell"></i></span> Notifications
                        <span id="notificationBadge" class="nav-item-badge" style="display:none">0</span>
                    </a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" onclick="logout(); return false;">
                    <span class="nav-item-icon"><i class="fa-solid fa-right-from-bracket"></i></span> Log out
                </a>
                <div class="user-profile">
                    <div id="userAvatar" class="user-avatar">U</div>
                    <div class="user-info">
                        <div id="userName" class="user-name">User</div>
                        <div class="user-role">Citizen</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1 class="header-title">Notifications</h1>
                <div class="header-actions">
                    <button onclick="markAllRead()" class="btn btn-secondary">Mark All as Read</button>
                </div>
            </header>

            <div class="page-content">
                <div class="card">
                    <div id="notificationList" class="notification-list">
                        <div class="skeleton" style="height: 80px; margin-bottom: 8px;"></div>
                        <div class="skeleton" style="height: 80px; margin-bottom: 8px;"></div>
                        <div class="skeleton" style="height: 80px;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/user.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Utils.requireUser()) return;
            const user = TokenManager.getUser();
            if (user) { document.getElementById('userName').textContent = user.full_name; document.getElementById('userAvatar').textContent = user.full_name.charAt(0); }
            await loadNotifications();
        });

        async function loadNotifications() {
            try {
                Utils.showLoading();
                const result = await API.User.getNotifications();
                if (result.success) renderNotifications(result.data.notifications);
            } catch (error) { Utils.showToast(error.message, 'error'); }
            finally { Utils.hideLoading(); }
        }

        function renderNotifications(notifications) {
            const container = document.getElementById('notificationList');
            if (!notifications || notifications.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No notifications</p></div>';
                return;
            }
            container.innerHTML = notifications.map(n => `
                <div class="notification-item ${n.is_read ? '' : 'unread'}" onclick="markRead(${n.notification_id})">
                    <div class="notification-icon"><i class="fa-solid fa-bell" style="font-size:16px;"></i></div>
                    <div class="notification-content">
                        <div class="notification-message">${n.message}</div>
                        <div class="notification-time">${Utils.timeAgo(n.created_at)}</div>
                    </div>
                </div>
            `).join('');
        }

        async function markRead(id) {
            await API.User.markNotificationRead(id);
            loadNotifications();
        }

        async function markAllRead() {
            await API.User.markAllNotificationsRead();
            loadNotifications();
            Utils.showToast('All marked as read', 'success');
        }
    </script>
</body>

</html>
