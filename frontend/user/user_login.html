<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPGRS</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">
                <div class="auth-logo-icon">🔐</div>
                <h1 class="auth-title">Welcome</h1>
                <p class="auth-subtitle">Sign in to your SPGRS account</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <div id="errorMsg" class="alert alert-danger" style="display:none;"></div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="user_register.html">Create Account</a>
            </div>

        </div>
    </div>

    <!-- ✅ REQUIRED SCRIPTS (ORDER IS IMPORTANT) -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>

    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("errorMsg");

            try {
                if (window.Utils) Utils.showLoading();

                const result = await API.Auth.login(email, password);

                if (result.success) {
                    const user = result.data.user;

                    if (user.role === "ADMIN") {
                        window.location.href = "../admin/admin_dashboard.html";
                    } else {
                        window.location.href = "user_dashboard.html";
                    }
                }

            } catch (err) {
                errorDiv.style.display = "block";
                errorDiv.textContent = err.message;
            } finally {
                if (window.Utils) Utils.hideLoading();
            }
        });

        // auto redirect if already logged in
        if (window.TokenManager && TokenManager.isAuthenticated()) {
            const user = TokenManager.getUser();
            window.location.href =
                user?.role === "ADMIN"
                    ? "../admin/admin_dashboard.html"
                    : "user_dashboard.html";
        }
    </script>

</body>
</html>
