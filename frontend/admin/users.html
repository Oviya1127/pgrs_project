<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - SPGRS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-container">
        
        <aside id="admin-sidebar" class="sidebar"></aside>

        <main class="main-content">
            <header class="main-header" style="background: #1a202c;">
                <h1 class="header-title">Users</h1>
            </header>

            <div class="page-content">
                <div class="card table-card">
                    <div class="card-header"><h3 class="card-title">Registered Users & Grievances</h3></div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>User ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Total Grievances</th>
                                    <th>Submitted</th>
                                    <th>In Progress</th>
                                    <th>Resolved</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <tr><td colspan="8" class="text-center p-6">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/admin-layout.js?v=3"></script>
    <script>
        async function loadUsersPage() {
            if (!Utils.requireAdmin()) return;
            try {
                const res = await API.Admin.getUsers(1, 200);
                if (res.success) {
                    const tbody = document.getElementById('usersTableBody');
                    tbody.innerHTML = res.data.map(u => `
                        <tr>
                            <td><strong>${u.user_id}</strong></td>
                            <td>${u.full_name}</td>
                            <td>${u.email}</td>
                            <td>${u.phone || '-'}</td>
                            <td>${u.total_grievances || 0}</td>
                            <td>${u.submitted || 0}</td>
                            <td>${u.in_progress || 0}</td>
                            <td>${u.resolved || 0}</td>
                        </tr>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', loadUsersPage);
    </script>
</body>
</html>
