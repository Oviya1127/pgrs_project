<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - SPGRS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="app-container">
        <aside id="admin-sidebar" class="sidebar"></aside>

        <main class="main-content">
            <header class="main-header" style="background: #1a202c;">
                <h1 class="header-title">Grievance Assignments</h1>
            </header>

            <div class="page-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Unassigned Grievances</h3>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Category</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="unassignedTableBody">
                                <tr>
                                    <td colspan="5" class="text-center p-6">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/admin-layout.js?v=3"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Utils.requireAdmin()) return;
            try {
                Utils.showLoading();
                const result = await API.Admin.getGrievances({ status: 'SUBMITTED' });
                if (result.success) {
                    const tbody = document.getElementById('unassignedTableBody');
                    const items = result.data.items || [];
                    if (items.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center p-6">No unassigned grievances</td></tr>';
                    } else {
                        tbody.innerHTML = items.map(g => `
                            <tr>
                                <td><strong>${g.grievance_id}</strong></td>
                                <td>${g.category_name || '-'}</td>
                                <td><span class="${Utils.getPriorityClass(g.priority_level)} priority-badge">${Utils.getPriorityLabel(g.priority_level)}</span></td>
                                <td><span class="${Utils.getStatusClass(g.status)} status-badge">${Utils.getStatusLabel(g.status)}</span></td>
                                <td><a href="grievance_review.html?id=${g.grievance_id}" class="btn btn-sm btn-primary">Assign</a></td>
                            </tr>
                        `).join('');
                    }
                }
            } catch (error) { Utils.showToast(error.message, 'error'); }
            finally { Utils.hideLoading(); }
        });
    </script>
</body>

</html>
