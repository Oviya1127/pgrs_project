<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Performance - SPGRS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="app-container">
        <aside id="admin-sidebar" class="sidebar"></aside>

        <main class="main-content">
            <header class="main-header" style="background: #1a202c;">
                <h1 class="header-title">Department Performance</h1>
                <div class="header-actions">
                    <a href="feedback.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-star-half-stroke"></i> Feedback &amp; Ratings</a>
                </div>
            </header>

            <div class="page-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Department Metrics</h3>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Department</th>
                                    <th>Assigned</th>
                                    <th>Resolved</th>
                                    <th>Resolution Rate</th>
                                    <th>Trust Score</th>
                                </tr>
                            </thead>
                            <tbody id="deptTableBody">
                                <tr>
                                    <td colspan="5" class="text-center">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/admin-layout.js?v=3"></script>
    <script src="../assets/js/admin.js"></script>
    <script>document.addEventListener('DOMContentLoaded', loadAnalytics);</script>
</body>

</html>
