<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback &amp; Ratings - SPGRS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <aside id="admin-sidebar" class="sidebar"></aside>
        <main class="main-content">
            <header class="main-header" style="background: #1a202c;">
                <h1 class="header-title">Feedback &amp; Ratings</h1>
                <div class="header-actions">
                    <a href="department_performance.html" class="btn btn-secondary btn-sm">Department trust scores</a>
                </div>
            </header>
            <div class="page-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title"><i class="fa-solid fa-star-half-stroke" style="margin-right:8px;color:var(--warning-600);"></i>Citizen ratings &amp; complaint-level feedback</h3>
                        <span id="feedbackTotal" class="badge badge-info">0 feedback</span>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Grievance ID</th>
                                    <th>User</th>
                                    <th>Rating</th>
                                    <th>Comments</th>
                                    <th>Submitted</th>
                                </tr>
                            </thead>
                            <tbody id="feedbackTableBody">
                                <tr><td colspan="5" class="text-center p-6">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/admin-layout.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            if (!Utils.requireAdmin()) return;
            try {
                Utils.showLoading();
                var res = await API.Admin.getFeedbackList(1, 100);
                var tbody = document.getElementById('feedbackTableBody');
                var totalEl = document.getElementById('feedbackTotal');
                if (!res.success || !res.data) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center p-6">Failed to load</td></tr>';
                    return;
                }
                var items = res.data.items || [];
                var total = res.data.total != null ? res.data.total : items.length;
                if (totalEl) totalEl.textContent = total + ' feedback';
                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center p-6">No feedback yet. Feedback is submitted by citizens on resolved grievances.</td></tr>';
                } else {
                    tbody.innerHTML = items.map(f => {
                        var date = f.submitted_at ? new Date(f.submitted_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
                        return '<tr><td><a href="grievance_review.html?id=' + (f.grievance_id || '') + '">' + (f.grievance_id || '—') + '</a></td><td>' + (f.user_name || '—') + '</td><td>' + (f.rating != null ? f.rating + '/5' : '—') + '</td><td>' + (f.comments || '—') + '</td><td>' + date + '</td></tr>';
                    }).join('');
                }
            } catch (e) {
                document.getElementById('feedbackTableBody').innerHTML = '<tr><td colspan="5" class="text-center p-6">Error loading feedback</td></tr>';
            }
            finally { Utils.hideLoading(); }
        });
    </script>
</body>
</html>
