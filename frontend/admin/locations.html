<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations / Zones - SPGRS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <aside id="admin-sidebar" class="sidebar"></aside>
        <main class="main-content">
            <header class="main-header" style="background: #1a202c;">
                <h1 class="header-title">Locations / Zones</h1>
                <div class="header-actions">
                    <span class="text-muted">Geographic monitoring</span>
                </div>
            </header>
            <div class="page-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title"><i class="fa-solid fa-map-location-dot" style="margin-right:8px;color:var(--primary-600);"></i>Ward &amp; zone-wise grievance distribution</h3>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>State</th>
                                    <th>District</th>
                                    <th>Total Grievances</th>
                                    <th>Resolved</th>
                                    <th>Resolution %</th>
                                </tr>
                            </thead>
                            <tbody id="locationsTableBody">
                                <tr><td colspan="5" class="text-center p-6">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/admin-layout.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Utils.requireAdmin()) return;
            try {
                Utils.showLoading();
                var res = await API.Analytics.getLocations();
                var tbody = document.getElementById('locationsTableBody');
                if (!res.success || !res.data || res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center p-6">No location data</td></tr>';
                } else {
                    tbody.innerHTML = res.data.map(l => {
                        var total = l.total_grievances || 0, resolved = l.resolved || 0;
                        var pct = total ? Math.round((resolved / total) * 100) : 0;
                        return '<tr><td>' + (l.state || '-') + '</td><td>' + (l.district || '-') + '</td><td>' + total + '</td><td>' + resolved + '</td><td><span class="badge ' + (pct >= 50 ? 'badge-success' : 'badge-warning') + '">' + pct + '%</span></td></tr>';
                    }).join('');
                }
            } catch (e) {
                document.getElementById('locationsTableBody').innerHTML = '<tr><td colspan="5" class="text-center p-6">Error loading data</td></tr>';
            }
            finally { Utils.hideLoading(); }
        });
    </script>
</body>
</html>
